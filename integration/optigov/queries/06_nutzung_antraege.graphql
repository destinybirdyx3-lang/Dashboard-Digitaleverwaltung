# Nutzung: nur Zählwert (totalCount) je Dienstleistung und Zeitraum.
# Es werden KEINE Antragsdatensätze (edges) abgerufen.
query AntraegeAnzahl($verwaltung: Int!, $dienstleistung: Int!, $von: String!, $bis: String!) {
  verwaltung(id: $verwaltung) {
    antraege(
      limit: 0
      filter: {
        dienstleistung: { id: { eq: $dienstleistung } }
        erstellt: { gte: $von, lt: $bis }
      }
    ) {
      totalCount
    }
  }
}
