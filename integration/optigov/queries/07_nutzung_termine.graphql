# Nutzung: gebuchte Termine je Dienstleistung (über Terminvorlage) und Zeitraum - nur Zählwert.
query TermineAnzahl($verwaltung: Int!, $dienstleistung: Int!, $von: String!, $bis: String!) {
  verwaltung(id: $verwaltung) {
    terminvereinbarungen(
      limit: 0
      filter: {
        terminvorlagen: { dienstleistung: { id: { eq: $dienstleistung } } }
        termin: { gte: $von, lt: $bis }
      }
    ) {
      totalCount
    }
  }
}
