# Formulare: nur Metadaten. formularserver ausschließlich mit Feld "anbieter".
query Formulare($verwaltung: Int!, $limit: Int!, $offset: Int!) {
  verwaltung(id: $verwaltung) {
    formulare(limit: $limit, offset: $offset, order: { id: { order: "asc" } }) {
      totalCount
      edges {
        node {
          id
          titel
          url
          benoetigte_vertrauensstufe
          erstellt
          bearbeitet
          formularserver { anbieter }
          dienstleistungen(limit: 50) { edges { node { id } } }
        }
      }
    }
  }
}
