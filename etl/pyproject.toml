[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mh-dashboard"
version = "0.1.0"
description = "ETL, Kennzahlen, Exporte und interne API des Digitalisierungs-Dashboards der Stadt Mülheim an der Ruhr"
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "tenacity>=8.3,<10",
  "jinja2>=3.1,<4",
  "weasyprint>=62",
  "openpyxl>=3.1,<4",
  "fastapi>=0.111,<1",
  "uvicorn>=0.30,<1",
  "pyjwt[crypto]>=2.8,<3",
  "graphql-core>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "pypdf>=4"]

[project.scripts]
mh-dashboard = "mh_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mh_dashboard = ["sql/*.sql", "export/templates/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/mh_dashboard/demo.py" = ["S311"]  # Demodaten, keine Kryptografie

[tool.pytest.ini_options]
testpaths = ["tests"]
